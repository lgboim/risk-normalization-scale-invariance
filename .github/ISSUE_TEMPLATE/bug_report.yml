name: Code or data-product bug
description: Report a reproducible problem in a public script or derived artifact.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload licensed market data, credentials, or private vendor material.
  - type: input
    id: file
    attributes:
      label: Affected file or artifact
      placeholder: work/research_factory/runs/diagnostics/...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction command and output
      render: shell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Python 3.12.4
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: Data and security check
      options:
        - label: I have not included licensed data, credentials, or non-public vendor material.
          required: true
