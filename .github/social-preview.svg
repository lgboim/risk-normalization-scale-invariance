  <text x="74" y="586" fill="#a7b0b8" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22">Ariel Elboim · Replication archive v1.0.1</text>
  <rect x="1176" y="72" width="32" height="496" rx="16" fill="url(#accent)" opacity="0.9"/>
