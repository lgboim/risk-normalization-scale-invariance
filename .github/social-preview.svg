<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Risk Normalization Does Not Imply Scale Invariance</title>
  <desc id="desc">Social preview for Ariel Elboim's paper and replication repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="1" stop-color="#0f1720"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a9d8f"/>
      <stop offset="1" stop-color="#7b4ab5"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1100" cy="88" r="170" fill="#7b4ab5" opacity="0.12" filter="url(#soft)"/>
  <circle cx="1010" cy="560" r="220" fill="#2a9d8f" opacity="0.10" filter="url(#soft)"/>

  <g opacity="0.18" fill="none" stroke="#e6eaee" stroke-width="1.5">
    <path d="M790 118 C900 58 978 178 1088 118 S1248 178 1320 118"/>
    <path d="M760 176 C890 102 980 250 1110 176 S1268 250 1340 176"/>
    <path d="M738 246 C882 158 984 334 1128 246 S1280 334 1350 246"/>
    <path d="M724 328 C878 222 988 434 1142 328 S1294 434 1360 328"/>
  </g>

  <rect x="72" y="72" width="122" height="8" rx="4" fill="url(#accent)"/>
  <text x="72" y="132" fill="#a7b0b8" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="3">RESEARCH SOFTWARE · FUTURES</text>

  <text x="72" y="232" fill="#ffffff" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.6">
    <tspan x="72" dy="0">Risk Normalization Does Not</tspan>
    <tspan x="72" dy="68">Imply Scale Invariance</tspan>
  </text>

  <text x="74" y="404" fill="#e6eaee" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="400">
