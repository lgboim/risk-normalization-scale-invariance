name: Repository quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install metadata validator
        run: python -m pip install PyYAML==6.0.3

      - name: Compile public Python scripts
        run: python -m compileall -q work/research_factory/runs/diagnostics

      - name: Validate JSON metadata
        run: |
          python -m json.tool codemeta.json >/dev/null
          python -m json.tool scale_invariance_public_replication_manifest.json >/dev/null

      - name: Validate citation metadata
        run: python -c "import yaml; yaml.safe_load(open('CITATION.cff', encoding='utf-8'))"

      - name: Check required public files
        run: |
          test -s README.md
          test -s REPRODUCIBILITY.md
          test -s CITATION.cff
          test -s codemeta.json
          test -s paper/risk_normalization_scale_invariance_ssrn_v1.pdf

      - name: Reject tracked caches and secrets
        run: |
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"
          test -z "$(git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$' || true)"
